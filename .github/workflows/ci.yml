# JavaScript-side verification. The dependency-direction rules of spec
# section 1.1 are enforced by a Vitest suite, so "test" below is also the gate
# that keeps the layering honest — CI is its primary line of defense
# (spec section 13), not the pre-commit hook.
#
# The Rust shell is not compiled here yet: a tauri crate needs the webkit/gtk
# system libraries on the runner, which is a follow-up once a native-side
# check is actually wanted.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version from the packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Test
        run: pnpm test
