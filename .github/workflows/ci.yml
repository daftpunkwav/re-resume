# JavaScript-side verification. The dependency-direction rules of spec
# section 1.1 are enforced by a Vitest suite, so "test" below is also the gate
# that keeps the layering honest — CI is its primary line of defense
# (spec section 13), not the pre-commit hook.
#
# The Rust shell is not compiled here yet: a tauri crate needs the webkit/gtk
# system libraries on the runner, which is a follow-up once a native-side
# check is actually wanted.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The pipeline only reads the repository; granting the default token more than
# that would widen the blast radius of a compromised step for no benefit.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit their tag names, not to the tag: a tag
      # is mutable, and the SonarCloud quality gate treats a mutable reference
      # in a workflow as a supply-chain vulnerability. The comment names the
      # release each SHA corresponds to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installs the pnpm version from the packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Test
        run: pnpm test
