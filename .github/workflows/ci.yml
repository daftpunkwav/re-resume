# JavaScript-side verification. The dependency-direction rules of spec
# section 1.1 are enforced by a Vitest suite, so "test" below is also the gate
# that keeps the layering honest — CI is its primary line of defense
# (spec section 13), not the pre-commit hook.
#
# The Rust shell is not compiled here yet: a tauri crate needs the webkit/gtk
# system libraries on the runner, which is a follow-up once a native-side
# check is actually wanted.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The pipeline only reads the repository; granting the default token more than
# that would widen the blast radius of a compromised step for no benefit.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit their tag names, not to the tag: a tag
      # is mutable, and the SonarCloud quality gate treats a mutable reference
      # in a workflow as a supply-chain vulnerability. The comment names the
      # release each SHA corresponds to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Later steps run package lifecycle scripts, which on a pull request
          # are PR-controlled code. Checkout leaves the job token in the local
          # Git config by default, where those scripts could read it; nothing
          # in this pipeline needs it after checkout.
          persist-credentials: false

      # pnpm/action-setup is third-party, and the repository allowed-actions
      # policy only admits GitHub-owned or Marketplace-verified actions, so
      # bootstrap pnpm with the corepack that ships with Node instead. The
      # version still comes from the packageManager field of package.json.
      # This runs on the runner's preinstalled Node so the pnpm shim is on
      # PATH before setup-node probes the pnpm store for caching.
      - name: Install pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser tests run in a headless Chromium. The dependency install
      # does not fetch it: package build scripts do not run in this pipeline,
      # so the browser is fetched here, with the system libraries it needs.
      - name: Install the browser for the browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Test
        run: pnpm test
