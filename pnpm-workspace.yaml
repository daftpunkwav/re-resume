# A release must be at least this many minutes old before pnpm resolves it,
# so a freshly published or compromised version cannot enter the tree on a
# casual install. The exclude list pins the exact versions this repository
# was locked against while they were younger than the window.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@asamuzakjp/dom-selector@10.0.3'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - jsdom@30.1.3
  - konva@10.9.0
  - react-konva@19.3.2
  - vitest@5.0.5
  # minimatch@11.0.8 is the reviewed ranged override below (the advisory fix),
  # and @isaacs/nonrecursive-glob-match@1.1.0 is its transitive dependency;
  # both were locked while younger than the window.
  - minimatch@11.0.8
  - '@isaacs/nonrecursive-glob-match@1.1.0'

# Version strategy: the runtime's load-bearing dependencies — the Tauri
# family, react, konva, zod, zustand and fontkit — are pinned exactly, so an
# upgrade is always a reviewed diff. fontkit must stay a single copy in the
# lockfile shared with @react-pdf/font and pdfkit: the text measurer and the
# PDF renderer must run on the same engine. konva is declared directly only
# to satisfy react-konva's peer range; no source file imports it.

# Development-only transitive packages with published security fixes. All are
# inside test, stylesheet, and lint tooling, not the desktop runtime; the
# overrides keep the dependency audit clean without waiting for the parent
# packages to republish.
overrides:
  fast-uri: ^3.1.9
  undici: ^8.12.2
  # Ranged so minimatch@3.1.5 (not in the advisory range) is left untouched.
  "minimatch@>=7.0.0 <11.0.1": 11.0.8
