[package]
name = "re-resume"
version = "0.1.0"
description = "ReResume — local-first resume workbench"
edition = "2024"
rust-version = "1.90"
publish = false

# The library is the crate the desktop binary and the mobile shells both link
# against, so `run()` lives here and `main.rs` only forwards to it.
[lib]
name = "re_resume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# `config-json5` is what lets the capability file carry comments: Tauri parses
# capability files with json5 only when this feature is on.
tauri-build = { version = "2.7.3", features = ["config-json5"] }

[dependencies]
tauri = { version = "2.12.4", features = ["config-json5"] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-http = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-stronghold = "2.4.0"

# `tauri::generate_context!` expands to code that names serde_json directly, so
# the crate has to be a dependency of this package rather than reachable only
# through tauri.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
